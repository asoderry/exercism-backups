name: Auto Merge Specific User PRs

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  auto-merge:
    if: github.actor == 'TARGET_USERNAME' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
